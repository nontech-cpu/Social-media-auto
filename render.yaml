services:
  - type: web
    name: social-media-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: MEDIA_STORAGE_PROVIDER
        value: cloudinary
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-3.8-flash,gemini-3.6-flash,gemini-3.7-flash
      - key: GEMINI_ENABLE_SEARCH_GROUNDING
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
